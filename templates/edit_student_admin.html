<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student</title>
    <link rel="stylesheet" href="{{ css_file }}">
</head>
<body>
    <h1 class="logo">Edit Student Data</h1>
    <form action="{{ url_for('edit_student_admin') }}" method="post">
        <label for="register_number">Register Number:</label>
        <input type="text" id="register_number" name="register_number" required><br>
        <label for="contact_number">New Contact Number:</label>
        <input type="text" id="contact_number" name="contact_number" required><br>
        <label for="email_id">New Email ID:</label>
        <input type="email" id="email_id" name="email_id" required><br>
        <button type="submit">Edit Student</button>
    </form>
    <button onclick="window.history.back()">Return Back</button>
</body>
</html>
